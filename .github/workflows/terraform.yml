name: Terraform Deployment

on:
  push:
    branches:
      - main

# Spostiamo le variabili d'ambiente a livello globale così sono disponibili per entrambi i job
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  # JOB 1: Esegue il Plan e salva il risultato
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      # Salviamo il piano in un file binario (tfplan)
      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Carichiamo il file tfplan come artefatto per passarlo al job successivo
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1

  # JOB 2: Attende approvazione su 'produzione' e applica il Plan
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan      # Attende la fine del job precedente
    environment: produzione    # Attiva il blocco per l'approvazione manuale

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Scarichiamo il file tfplan generato nel primo job
      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Init
        run: terraform init

      # Applichiamo esattamente il piano approvato (non serve -auto-approve passando un file)
      - name: Terraform Apply
        run: terraform apply tfplan
